<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Codex Support</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Local Codex Support</h1>
    <label><input id="threadSync" type="checkbox"> <span>Thread sync</span></label>
    <label><input id="ralf" type="checkbox"> <span>RALF automation</span></label>
    <label><input id="threadMessaging" type="checkbox"> <span>Agent thread messaging</span></label>
    <p>Enable RALF and agent messaging only in the browser you want Local Codex to automate.</p>

    <section>
      <label for="ralfProjects">RALF projects</label>
      <textarea id="ralfProjects" rows="6" placeholder="One project URL or project ID per line"></textarea>
      <button id="saveRalfProjects" type="button">Save projects</button>
      <p id="ralfProjectsStatus">Only threads inside these projects are registered for RALF.</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
