<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thread Sync</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 8px; }
    .card {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
      border-radius: 12px;
      background: color-mix(in srgb, Canvas 94%, transparent);
      color: CanvasText;
    }
    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: currentColor;
      opacity: .55;
    }
    .title { font-size: 13px; font-weight: 650; line-height: 1.2; }
    .status { margin-top: 2px; font-size: 12px; opacity: .7; line-height: 1.25; }
  </style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <div class="title">Thread Sync</div>
      <div class="status" id="status">Connecting this conversation...</div>
    </div>
  </div>
  <script>
    const bindingKey = "local-codex/thread-binding";
    const requestType = "local-codex-thread-sync/bind-v1";
    const responseType = "local-codex-thread-sync/result-v1";
    const statusElement = document.getElementById("status");
    let ticket;
    let retryTimer;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function sendTicket() {
      if (!ticket || Date.now() >= ticket.expiresAt) {
        clearInterval(retryTimer);
        if (ticket) setStatus("Sync request expired. Run sync again.");
        return;
      }
      window.top.postMessage({ type: requestType, token: ticket.token }, "https://chatgpt.com");
    }

    function receiveTicket(result) {
      if (result?.structuredContent?.status === "synced") {
        clearInterval(retryTimer);
        setStatus("This conversation is synced.");
      }

      const next = result?._meta?.[bindingKey];
      if (!next || !/^[A-Za-z0-9_-]{43}$/.test(next.token) || !Number.isFinite(next.expiresAt)) return;
      if (ticket?.token === next.token) return;
      ticket = next;
      setStatus("Connecting this conversation...");
      clearInterval(retryTimer);
      retryTimer = setInterval(sendTicket, 100);
      sendTicket();
    }

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (event.source === window.top && event.origin === "https://chatgpt.com" &&
          message?.type === responseType && ticket && message.token === ticket.token) {
        if (message.status === "bound") {
          clearInterval(retryTimer);
          setStatus("This conversation is synced.");
        } else if (message.retryable === false) {
          clearInterval(retryTimer);
          setStatus(message.error || "Thread sync failed.");
        } else if (message.status === "error") {
          setStatus("Reconnecting to Thread Sync...");
        }
        return;
      }
      if (event.source !== window.parent || message?.jsonrpc !== "2.0") return;
      if (message.id === "thread-sync-init" && message.result) {
        window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
      }
      if (message.method === "ui/resource-teardown") {
        clearInterval(retryTimer);
        window.parent.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
      }
      if (message.method === "ui/notifications/tool-result") receiveTicket(message.params);
    });

    function readOpenAiResult() {
      const metadata = window.openai?.toolResponseMetadata;
      receiveTicket(metadata);
      receiveTicket(metadata?.mcp_tool_result);
      receiveTicket(metadata?.call_tool_result);
    }

    window.addEventListener("openai:set_globals", readOpenAiResult);
    readOpenAiResult();
    window.parent.postMessage({
      jsonrpc: "2.0",
      id: "thread-sync-init",
      method: "ui/initialize",
      params: {
        protocolVersion: "2026-01-26",
        appInfo: { name: "local-codex-thread-sync", version: "0.4.2" },
        appCapabilities: {},
      },
    }, "*");
  </script>
</body>
</html>
